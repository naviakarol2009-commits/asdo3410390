<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01-events</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        body.mainmenu {
            overflow-y: hidden;
            background-color: #2c2c2c; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        nav.back {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .game-title {
            color: #ffffff;
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 400px;
            background-image: url('imgs/casita.jpeg');
            background-size: cover; 
            background-position: center;
            border: 4px solid #444;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden; 
            margin-bottom: 20px;
            
            image-rendering: -moz-crisp-edges;         
            image-rendering: -webkit-optimize-contrast; 
            image-rendering: crisp-edges;
            image-rendering: pixelated;                
        }

        @keyframes walkAnim {
            0% { background-position-x: 0%; }
            25% { background-position-x: 33.33%; }
            50% { background-position-x: 66.66%; }
            75% { background-position-x: 100%; }
            100% { background-position-x: 0%; }
        }

        .character {
            position: absolute;
            width: 100px;  
            height: 100px;
            background-image: url('imgs/muñequitos.jpeg'); 
            background-size: 400% 400%; 
            background-position-y: 0%; 
            animation: walkAnim 0.8s steps(1) infinite;
            bottom: 20px;
            left: 150px; 
            mix-blend-mode: multiply; 
            image-rendering: pixelated;
            
            /* ESTO HACE QUE EL MUÑECO SE VEA POR ENCIMA DE LA CASA */
            z-index: 10; 
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            justify-content: center;
            position: static; 
        }

        .controls button {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .controls button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .controls button:hover {
            background-color: #45a049;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body class="mainmenu">
    <nav class="back">
        <a href="index.html" aria-label="Volver al menú de Layout">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>

    <main>
        <header style="display: flex; flex-direction: column; align-items: center; position: relative;">
            
            <h1 class="game-title">01-EVENTS</h1>
            
            <div class="game-container">
                <div class="character" id="character"></div>
            </div>

            <div class="controls">
                <button class="btn-up" onclick="move('up')">&uarr;</button>
                <button class="btn-left" onclick="move('left')">&larr;</button>
                <button class="btn-down" onclick="move('down')">&darr;</button>
                <button class="btn-right" onclick="move('right')">&rarr;</button>
            </div>
        </header>
    </main>

    <script>
        const character = document.getElementById('character');
        
        // Posición inicial
        let posX = 150; 
        let posY = 280; 
        const speed = 15; 
        
        // LÍMITES DEL ESCENARIO (La "Colisión")
        const containerSize = 400; 
        const charSize = 100; 
        
        // AQUÍ ESTÁ EL CAMBIO: 210 es justo en la entrada de la puerta
        const limiteArriba = 210; 
        
        const limiteAbajo = containerSize - charSize - 10; // No se sale por abajo
        const limiteIzquierda = 10; // No se sale por la izquierda
        const limiteDerecha = containerSize - charSize - 10; // No se sale por la derecha

        function move(direction) {
            
            // Lógica de movimiento con límites
            if (direction === 'up' && posY > limiteArriba) {
                posY -= speed;
                character.style.backgroundPositionY = '100%'; // Fila 4: Espaldas
            } 
            else if (direction === 'down' && posY < limiteAbajo) {
                posY += speed;
                character.style.backgroundPositionY = '0%';   // Fila 1: Frente
            } 
            else if (direction === 'left' && posX > limiteIzquierda) {
                posX -= speed;
                character.style.backgroundPositionY = '33.33%'; // Fila 2: Izquierda
            } 
            else if (direction === 'right' && posX < limiteDerecha) {
                posX += speed;
                character.style.backgroundPositionY = '66.66%'; // Fila 3: Derecha
            }
            
            character.style.left = posX + 'px';
            character.style.top = posY + 'px';
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowUp') move('up');
            if (event.key === 'ArrowDown') move('down');
            if (event.key === 'ArrowLeft') move('left');
            if (event.key === 'ArrowRight') move('right');
        });
    </script>
</body>
</html>
